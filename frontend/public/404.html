<!doctype html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>Leaner</title>
        <script>
            // SPA fallback for GitHub Pages: rewrite the path into a query
            // string, redirect to index.html, which restores the real path
            // via the companion script in index.html. See spa-github-pages.
            var l = window.location;
            l.replace(
                l.protocol +
                    "//" +
                    l.hostname +
                    (l.port ? ":" + l.port : "") +
                    l.pathname
                        .split("/")
                        .slice(0, 1)
                        .join("/") +
                    "/?/" +
                    l.pathname.slice(1).split("/").join("/").replace(/&/g, "~and~") +
                    (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
                    l.hash,
            );
        </script>
    </head>
    <body></body>
</html>
